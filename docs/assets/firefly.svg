<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 52" width="48" height="52" overflow="visible" aria-label="Lumen firefly mascot">
  <defs>
    <radialGradient id="halo-glow" cx="50%" cy="80%" r="55%">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ground halo -->
  <ellipse cx="24" cy="46" rx="13" ry="5.5" fill="url(#halo-glow)" opacity="0.45">
    <animate attributeName="opacity" values="0.14;0.52;0.14" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Wings -->
  <ellipse cx="13" cy="23" rx="8" ry="4"
           fill="rgba(63,185,80,0.18)"
           transform="rotate(-30 13 23)"/>
  <ellipse cx="35" cy="23" rx="8" ry="4"
           fill="rgba(63,185,80,0.18)"
           transform="rotate(30 35 23)"/>

  <!-- Body + head -->
  <ellipse cx="24" cy="22" rx="5" ry="8.5" fill="rgba(63,185,80,0.72)"/>
  <circle  cx="24" cy="13" r="4"            fill="rgba(63,185,80,0.72)"/>

  <!-- Antennae -->
  <line x1="22" y1="10" x2="16" y2="4"
        stroke="rgba(63,185,80,0.72)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="26" y1="10" x2="32" y2="4"
        stroke="rgba(63,185,80,0.72)" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="16" cy="4" r="1.2" fill="rgba(63,185,80,0.72)"/>
  <circle cx="32" cy="4" r="1.2" fill="rgba(63,185,80,0.72)"/>

  <!-- Tail lantern -->
  <ellipse cx="24" cy="33" rx="6" ry="5" fill="rgba(63,185,80,0.52)"/>

  <!-- Bioluminescent core -->
  <ellipse cx="24" cy="33" rx="3" ry="2.5" fill="#3fb950" filter="url(#core-glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
</svg>
