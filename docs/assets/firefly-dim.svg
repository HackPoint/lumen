<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 52" width="48" height="52" overflow="visible" aria-label="Lumen firefly mascot (idle)">
  <defs>
    <radialGradient id="halo-dim" cx="50%" cy="80%" r="55%">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground halo (dim) -->
  <ellipse cx="24" cy="46" rx="13" ry="5.5" fill="url(#halo-dim)" opacity="0.18"/>

  <!-- Wings -->
  <ellipse cx="13" cy="23" rx="8" ry="4"
           fill="rgba(139,148,158,0.18)"
           transform="rotate(-30 13 23)"/>
  <ellipse cx="35" cy="23" rx="8" ry="4"
           fill="rgba(139,148,158,0.18)"
           transform="rotate(30 35 23)"/>

  <!-- Body + head -->
  <ellipse cx="24" cy="22" rx="5" ry="8.5" fill="rgba(139,148,158,0.45)"/>
  <circle  cx="24" cy="13" r="4"            fill="rgba(139,148,158,0.45)"/>

  <!-- Antennae -->
  <line x1="22" y1="10" x2="16" y2="4"
        stroke="rgba(139,148,158,0.45)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="26" y1="10" x2="32" y2="4"
        stroke="rgba(139,148,158,0.45)" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="16" cy="4" r="1.2" fill="rgba(139,148,158,0.45)"/>
  <circle cx="32" cy="4" r="1.2" fill="rgba(139,148,158,0.45)"/>

  <!-- Tail lantern (dim) -->
  <ellipse cx="24" cy="33" rx="6" ry="5" fill="rgba(139,148,158,0.30)"/>
  <ellipse cx="24" cy="33" rx="3" ry="2.5" fill="rgba(139,148,158,0.55)"/>
</svg>
