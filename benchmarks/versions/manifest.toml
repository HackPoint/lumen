# Per-version pins and capability map for the version-over-version benchmark (V1).
#
# Committed before any run (METHOD.md, "Honesty rule"). The assets are the published release
# files of HackPoint/lumen, never a rebuild; each sha256 is GitHub's digest of the asset from
# `gh release view v<version> -R HackPoint/lumen --json assets`, resolved on 2026-10-18.
# Every pin is a full 40-character commit or a 64-hex sha256 (benchmarks/harness/tests/pins.rs).
#
# The capability map is a CLAIM, not a fact the harness trusts: probes check it at run time, a
# probe that disagrees with the map stops the run, and the map is then corrected in a commit of
# its own. The values come from the approved plan's table (docs of each release, the changelog).
#
# Fields
#   saved_tokens     "clamped" (1.0.0: the self-reported saving is floored at zero; recorded,
#                    never used) or "signed"
#   hook_kind        "scripts"            bash and python3 scripts, counting via lumen-tok
#                    "scripts+cli"        scripts that exec `lumen-mcp hook intercept|meter`
#                    "scripts+cli+identity" the same plus the identity hook on mcp__lumen__*
#   hook_cli         true when the binary has a `hook` subcommand (1.6.0+). Where false,
#                    `lumen-mcp hook ...` silently starts an MCP server and is never spawned.
#   bash_meter       the Bash meter and `would_inflate` exist
#   repeat_reads     "none", "opt-in" (LUMEN_REPEAT_READS) or "default"
#   identity         "none", "env" or "hook"
#   daemon_env       the LUMEN_* variables the daemon reads (from each tag's sources), to be
#                    pointed at scratch or cleared; LUMEN_SUPERVISED is read from 1.2.4
#   daemon_fixed_port the daemon binds a fixed port (1.0.0: 127.0.0.1:9999) and so collides
#                    with a running Lumen app
#   daemon_reads_home the daemon reads $HOME/.claude/projects (1.0.0)
#   e2e              the version is an E2E arm; 1.1.5 stands in for 1.0.0
#
# Assets: one table per OS. The app asset is the one that carries lumen-mcp, lumen-daemon and
# lumen-tok (the CLI archives hold only the `lumen` CLI and are not used). Windows installers
# are unpacked with 7z and never run. An OS without an asset is `na = "<reason>"`.

[meta]
repo = "https://github.com/HackPoint/lumen"
resolved_on = "2026-10-18"
versions = ["1.0.0", "1.1.5", "1.2.4", "1.3.1", "1.4.0", "1.5.1", "1.6.0", "1.7.0", "1.8.0", "1.9.0"]
e2e = ["1.1.5", "1.6.0", "1.8.0", "1.9.0"]
e2e_stand_in = { "1.0.0" = "1.1.5" }

