# --- Lumen scenarios ---------------------------------------------------------------------------
# Three tasks that stress what Lumen is for. Each is a real upstream fix or change: the base is
# the parent of an upstream commit, the gold patch is that commit's source change, and the hidden
# tests either come from that commit or are written in E2 and shown to fail at the base and pass
# with the gold patch (E2's acceptance). All three are BSD-3-Clause Python projects; the agent
# is given the repository at `base_commit` with no .git history after it, a fresh container
# per run, and none of the hidden tests.
# If E2 finds a prompt below cannot be judged as written, the prompt is amended in a commit
# before the pilot, never after it (METHOD.md, "Honesty rule").

[[scenario]]
id = "large-file-exploration"
title = "A fix inside a 4,000-line source file"
repo = "https://github.com/pallets/click"
license = "BSD-3-Clause"
base_commit = "4b24a6c8f6658ef89fd6db4dcaf8ee88eef75dfa"
gold_commit = "7d05a59b9d46a415d85937630d1d812cf477f60a" # "Fix get_parameter_source() during type conversion and eager callbacks"
language = "python"
large_file = "src/click/core.py" # 4,038 lines at the base commit
prompt = """\
In this repository, `Context.get_parameter_source(name)` returns None when it is called from \
inside `ParamType.convert()` or from an eager option's callback, although by then the \
parameter's source (command line, environment, default, ...) is already known. A parameter \
that has not been processed yet may still be None; one that is being converted or whose \
eager callback is running must report its source. Fix it. When several options share one \
parameter name and one of them loses the arbitration, the winner's source must be the one \
that stays recorded. Do not change any other behaviour. Run the existing tests that cover \
what you touched."""
success = "hidden FAIL_TO_PASS: the tests added by the gold commit in tests/test_defaults.py and tests/test_options.py (hidden from the agent); PASS_TO_PASS: the rest of tests/ at the base commit, run in E2"

[[scenario]]
id = "log-heavy-debugging"
title = "A bug found through a long CI log"
repo = "https://github.com/pallets/werkzeug"
license = "BSD-3-Clause"
base_commit = "f7e37f0bf510fa355fdac3e922cc2078916b021f"
gold_commit = "594452f6a4fe4de38a544962fbf04bfc9d37fbc2" # "put sign in correct place for small negative float"
language = "python"
log = "ci.log" # E2 produces it: `python -m pytest -v -rA tests` at the base commit with the hidden test included, so the failure is in it, buried in the passing lines; its size and sha256 are recorded in E2
prompt = """\
A CI run of this repository's test suite failed. The complete output of `python -m pytest -v \
-rA tests` is in `ci.log` in the repository root. Find out why the run failed, fix the cause in \
the source (not in the tests), and check the fix by running the failing test. Do not change \
any other behaviour."""
success = "hidden FAIL_TO_PASS: the routing test case added by the gold commit (tests/test_routing.py, 'no exp small negative'); PASS_TO_PASS: the rest of tests/"

[[scenario]]
id = "multi-file-refactor"
title = "A rename and tightening across three files"
repo = "https://github.com/pallets/werkzeug"
license = "BSD-3-Clause"
base_commit = "40d4b497104db492273057c19425a6d47442bd29"
gold_commit = "50f5cfb31b39f8c10c12dda5ef8176fd2c1aeaf7" # "private `parse_age` and `dump_age`"
language = "python"
files_touched_by_gold = ["src/werkzeug/_header_property.py", "src/werkzeug/http.py", "src/werkzeug/sansio/response.py"]
prompt = """\
Make the Age header helpers private and tighten their edge cases. In `werkzeug.http`, replace \
the public `parse_age` and `dump_age` with private `_load_age(value: str)` and \
`_dump_age(value)`, update every caller, and do not keep the old names. `_load_age` returns \
None for a value that is not a base-10 integer, is negative, or overflows a timedelta; \
`_dump_age` takes a timedelta or an int and raises ValueError for a negative one. Make \
`_load_retry_after` and `_dump_retry_after` follow the same rules for a number of seconds \
(negative loads as None and dumps as ValueError). `header_property` must not run its \
`load_func` on its default value when the header is absent. Keep the existing tests passing."""
success = "hidden FAIL_TO_PASS: tests written in E2 for the behaviour above (they fail at the base commit and pass with the gold patch); PASS_TO_PASS: the rest of tests/"
