# --- squeez ------------------------------------------------------------------------------------
[[arm]]
id = "squeez"
name = "squeez"
kind = "competitor"
repo = "https://github.com/claudioemmanuel/squeez"
license = "Apache-2.0"
version = "1.48.18"
tag = "v1.48.18"
commit = "fa10c0dde7a81bdc5bea41dbaf5fa9c975624872" # the tag is annotated; this is the commit it points at
hooks_into_claude_code = "PreToolUse rewrites Bash to `squeez wrap`; PostToolUse rewrites Read/Grep/Glob output (updatedToolOutput); SessionStart, PreCompact, PostCompact, SubagentStop. The MCP server is optional and off by default."
install_script = { path = "install.sh", sha256 = "cb88b19de09c7f7b541f99041c302e05351a71753923b6c5eee6c9f85d002048" } # at the tag
install = [
  "install.sh downloads `releases/latest/download/...`, so it is not run: download the squeez-linux-x86_64 asset of v1.48.18 instead",
  "check the asset's sha256 below (it also matches the release's checksums.sha256, itself pinned below)",
  "put it at $HOME/.claude/squeez/bin/squeez, mode 0755, as install.sh does",
  "run `squeez setup` (defaults: registers into every detected host, here only Claude Code)",
]
checksum_file = { name = "checksums.sha256", sha256 = "6b7c7b39f421bf465f391535242b5e292269eb529af27bc2e784c016b5d1b22d" }
telemetry_env = { DO_NOT_TRACK = "1" } # the README documents no telemetry; set anyway
[[arm.asset]]
platform = "linux-x86_64"
name = "squeez-linux-x86_64"
sha256 = "0aca3560464b643a98519a149ee4568720931164beaba3910b27ec1547142825"

# --- RTK ---------------------------------------------------------------------------------------
[[arm]]
id = "rtk"
name = "RTK"
kind = "competitor"
repo = "https://github.com/rtk-ai/rtk"
# The default `rtk-<target>` asset is the Apache-2.0 CLI plus the BUSL-1.1 compression engine;
# BUSL-1.1 production use is free, and no term forbids publishing a benchmark. The Apache-2.0
# only edition is `rtk-oss-<target>` (RTK_EDITION=oss); it is not the default and is not used.
license = "Apache-2.0 (CLI) + BUSL-1.1 (engine, in the default binary)"
version = "1.0.1"
tag = "v1.0.1"
commit = "4ef8730cf3a0dea11c8d64a9b90bc0616fe52100" # lightweight tag
hooks_into_claude_code = "PreToolUse Bash rewrite (git status becomes rtk git status); the default edition adds PostToolUse compression."
install_script = { path = "install.sh", sha256 = "7ca3997314f631b8ad267e5add9af4b7a2f0351bdab0b1c5a9b7ed4008d0434a" } # at the tag
install = [
  "RTK_VERSION=v1.0.1 sh install.sh (it verifies the archive against the release's checksums.txt and refuses on a mismatch); on x86_64 Linux it takes rtk-x86_64-unknown-linux-musl.tar.gz, sha256 below",
  "rtk init -g --auto-patch (the recommended global hook-first setup, patching settings.json without a prompt)",
  "the optional rtk-proxy daemon is declined: not installed, not started",
]
checksum_file = { name = "checksums.txt", sha256 = "3dc6975d97c9faa43aa997a5d68a3255ceccea43ffa2d9d9ac22950b1b2d93a2" }
telemetry_env = { DO_NOT_TRACK = "1" } # telemetry is off until `rtk telemetry enable`; never run
[[arm.asset]]
platform = "linux-x86_64"
name = "rtk-x86_64-unknown-linux-musl.tar.gz"
sha256 = "5b919c3bccb799b67a61866d0e617410a4fcdf173e2614440e59de2fa2003436"

# --- Headroom ----------------------------------------------------------------------------------
[[arm]]
id = "headroom"
name = "Headroom"
kind = "competitor"
repo = "https://github.com/headroomlabs-ai/headroom" # chopratejas/headroom redirects here; nyckm/headroom is a fork
license = "Apache-2.0 (the paid Enterprise tier is excluded)"
version = "0.41.0"
tag = "v0.41.0"
commit = "76133cff59b71284399bf760c5578dc373c97231" # lightweight tag
hooks_into_claude_code = "`headroom wrap claude`: a local proxy, ANTHROPIC_BASE_URL=http://127.0.0.1:<port>; also installs Serena for the wrapped project."
install = [
  "uv tool install --python 3.13 --exclude-newer 2026-10-18T00:00:00Z \"headroom-ai[all]==0.41.0\" (the wheel's sha256 is below; --exclude-newer fixes the unpinned transitive dependencies to what existed on the resolving date)",
  "fetch the Kompress-v2-base weights once, at the pinned revision below, then run with HF_HUB_OFFLINE=1 so the run does not depend on a moving model",
  "launch Claude Code as `headroom wrap claude -- <claude args>`",
]
telemetry_env = { HEADROOM_BEACON = "off", DO_NOT_TRACK = "1", HF_HUB_OFFLINE = "1" }
[[arm.asset]]
platform = "linux-x86_64"
name = "headroom_ai-0.41.0-cp310-abi3-manylinux_2_28_x86_64.whl" # same sha256 on PyPI and the GitHub release
sha256 = "f4db5e5119a73af3ed952b1c10caff2430831d899eb17d995a27574ae6e6b306"
[arm.model]
repo = "chopratejas/kompress-v2-base" # Hugging Face, apache-2.0
commit = "e00cc5e60ff73b01674ef8fa6da6c5acf6d54181" # last modified 2026-09-17

# --- Caveman -----------------------------------------------------------------------------------
[[arm]]
id = "caveman"
name = "Caveman"
kind = "competitor"
repo = "https://github.com/JuliusBrussee/caveman"
license = "Apache-2.0" # Caveman Cloud (login, "Auto") is separate commercial software and is not used
version = "4.0.1"
tag = "v4.0.1"
commit = "d262ab3882952a59312ff3537cd86d894523c5ab" # the tag is annotated; this is the commit it points at
hooks_into_claude_code = "the Claude Code plugin (skill, hooks and a statusline badge that set the output style); 4.0 adds local parts it calls rocks, all on after install."
install_script = { path = "install.sh", sha256 = "c129b946a1f7f2e9eeeff5c1a747d7b43b2630c6b9e5fc7aa8297cece9cd3804" } # at the tag
install = [
  "the README's `npx @caveman-ai/cli@latest` is interactive and unpinned; the non-interactive pinned path is the tag's own script: curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/v4.0.1/install.sh | bash -s -- --only claude --non-interactive",
  "no `caveman login`, no Auto, no providers",
  "the pilot checks `caveman status` and records which rocks are on; anything the script leaves off at defaults stays off",
]
# Scripted `claude -p` starts with caveman OFF whatever the install did (INSTALL.md), so the arm
# turns it on the documented way (extra_env). Without it the arm would measure stock Claude Code.
telemetry_env = { DO_NOT_TRACK = "1" } # `caveman telemetry off` is the same switch; the CLI sends usage stats by default
extra_env = { CAVEMAN_DEFAULT_MODE = "caveman" } # not telemetry: the arm's one other non-default setting, recorded in METHOD.md
npm = { package = "@caveman-ai/cli", version = "4.0.1", integrity = "sha512-ik1hgVGrhkha9YcZKSijfcS97nKjwYKyI4rvs7+7spTsNyBWClhgC2lAzgDkj3n5OvFcaROzNOHQ3jcS3AYCxw==" }

# Not in scope: ojuschugh1/sqz (a different compressor), reachingforthejack/rtk (a different tool
# that shares RTK's name), and any paid tier.
