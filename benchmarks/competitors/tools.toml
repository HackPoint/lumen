# The arms of the competitor comparison (Layer 1 replay and Layer 2 end to end).
#
# Committed before any run (METHOD.md, "Honesty rule"). Every pin is a full 40-character git
# commit or a 64-hex sha256; an abbreviated value is a test failure
# (benchmarks/harness/tests/pins.rs). Resolved on 2026-10-18 with `git ls-remote` and
# `gh release view --json assets` (GitHub's own sha256 digest of each asset); where a project
# publishes a checksum file it was downloaded and the rows below match it.
#
# Nothing here was installed or run to produce it. No arm is paid. The arms run at their
# defaults except for the telemetry switches in `telemetry_env`, a deviation METHOD.md records.

[meta]
resolved_on = "2026-10-18"
model = "claude-sonnet-5-5"

[claude_code]
# Pinned for every arm: `npm i @anthropic-ai/claude-code@2.1.292` (the npm `stable` dist-tag on
# the resolving date), with DISABLE_AUTOUPDATER=1.
package = "@anthropic-ai/claude-code"
version = "2.1.292"
npm_integrity = "sha512-ptT9UcOsyR2VLNgfHgF87To8B7tCrZktIpYC4dEGt+9MG42NAWsljEGBZ3spdHcJ2akednszESVNti7hWxZrJg=="
env = { DISABLE_AUTOUPDATER = "1" }

# --- no Lumen ----------------------------------------------------------------------------------
[[arm]]
id = "none"
name = "no Lumen"
kind = "none"
shared = true # run once, cited by both the competitor and the version reports
install = ["nothing: stock Claude Code at the pinned version, no hooks, no MCP servers"]

