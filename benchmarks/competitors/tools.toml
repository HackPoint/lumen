tag = "v1.9.0"
commit = "a74421383ea1b4cad801c72ca0fb370014cf4974"
install = [
  "download lumen_1.9.0_amd64.deb from the v1.9.0 release and check the sha256 below",
  "unpack it without installing (ar x, then tar): usr/bin/{lumen-mcp,lumen-daemon,lumen-tok} are the sidecars",
  "there is no headless Setup: the arm writes into the run's fresh HOME the same mcpServers entry and hooks that Setup writes (lumenator/src-tauri/src/setup.rs), and E1 checks the result against what setup.rs produces",
