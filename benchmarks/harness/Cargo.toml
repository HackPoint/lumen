[package]
name = "lumen-bench"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
default-run = "lumen-bench"
description = "On-demand benchmark harness for the Lumen MCP server and hooks. Dev-only: nothing shipped depends on it."

[lib]
name = "lumen_bench"
path = "src/lib.rs"

[[bin]]
name = "lumen-bench"
path = "src/main.rs"

# A stand-in for `claude` that the end-to-end tests run (no network, no model, no cost): it prints
# recorded stream-json, writes recorded transcripts into $HOME/.claude/projects, or keeps
# "spending". A binary rather than a script so the tests run on Windows too.
[[bin]]
name = "lumen-bench-stub-claude"
path = "src/bin/stub_claude.rs"

# Dev-only. No shipped binary (lumen-mcp, lumen-daemon, lumen-cli, the app) depends on this
# crate, and it adds nothing to their dependency trees: every dependency below is already in
# Cargo.lock. lumen-mcp is linked as a library only to time the hook in-process.
[dependencies]
lumen-core = { path = "../../crates/lumen-core" }
lumen-mcp = { path = "../../crates/lumen-mcp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
# Parses the committed method files (benchmarks/{competitors,versions}/*.toml). `toml` 1.1.6 is
# already in Cargo.lock (the Tauri build uses it), so this adds no package.
toml = "1.1"


# Process CPU time and memory for the idle measurements (versions/daemon.rs). Both are already in
# Cargo.lock (libc 0.2.190, windows-sys 0.61.2); Windows takes only the three modules it calls.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
