[workspace]
resolver = "2"
members = [
    "crates/lumen-core",
    "crates/lumen-cli",
    "crates/lumen-daemon",
    "crates/lumen-mcp",
    "crates/lumen-stats",
    "lumenator/src-tauri",
    # On-demand benchmarks (benchmarks/README.md). Dev-only: no shipped binary depends on it.
    "benchmarks/harness",
]

# The oldest compiler this workspace builds on, inherited by every crate: sqlx 0.9 requires
# 1.94.0, and every crate reaches it through lumen-core. The `msrv` job in ci.yml builds the
# whole workspace on exactly this version, read from here, so the two cannot drift.
[workspace.package]
rust-version = "1.94.0"
