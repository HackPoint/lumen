<div class="cost">
    <!-- hero tiles: the two numbers that matter most -->
    <div class="cost__heroes">
        <div class="tile tile--hero">
            <div class="tile__label">
                Session cost
                <button class="info-btn" type="button"
                        [lumenTooltip]="'Cost of the active session — input, output, and cache tokens priced at the published Anthropic rate table.'">ⓘ</button>
            </div>
            <div class="tile__value"
                 [class.tile__value--long]="isLong(fmt(totalCost()))"
                 [class.tile__value--xlong]="isXLong(fmt(totalCost()))">{{ fmt(totalCost()) }}</div>
        </div>

        <div class="tile tile--hero tile--save">
            <div class="tile__label">
                Saved by caching
                <button class="info-btn" type="button"
                        [lumenTooltip]="'Reported by Claude Code — tokens served from cache. NOT caused by Lumen.'">ⓘ</button>
            </div>
            <div class="tile__value"
                 [class.tile__value--long]="isLong(fmt(cacheSavings()))"
                 [class.tile__value--xlong]="isXLong(fmt(cacheSavings()))">{{ fmt(cacheSavings()) }}</div>
            <div class="tile__sub">{{ fmtPct(cacheHitRate()) }} cache hit rate</div>
        </div>
    </div>

    <!-- quiet breakdown — hidden in the compact popover -->
    <div class="cost__breakdown breakdown">
        <div class="stat">
            <span class="stat__label">
                Output
                <button class="info-btn" type="button"
                        [lumenTooltip]="'Tokens generated by the model this session.'">ⓘ</button>
            </span>
            <span class="stat__value">{{ fmt(costOutput()) }}</span>
        </div>
        <div class="stat">
            <span class="stat__label">
                Cache read
                <button class="info-btn" type="button"
                        [lumenTooltip]="'Tokens served from Claude Code\'s prompt cache this session.'">ⓘ</button>
            </span>
            <span class="stat__value">{{ fmt(costCacheRead()) }}</span>
        </div>
        <div class="stat">
            <span class="stat__label">
                Fresh input
                <button class="info-btn" type="button"
                        [lumenTooltip]="'New prompt tokens not covered by the cache this session.'">ⓘ</button>
            </span>
            <span class="stat__value">{{ fmt(costInput()) }}</span>
        </div>
        <div class="stat">
            <span class="stat__label">
                Cache write
                <button class="info-btn" type="button"
                        [lumenTooltip]="'Tokens written into the cache this session.'">ⓘ</button>
            </span>
            <span class="stat__value">{{ fmt(costCacheWrite()) }}</span>
        </div>
    </div>
</div>
