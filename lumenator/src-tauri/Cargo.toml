[package]
name = "Lumen"
version = "1.1.0"
description = "macOS menu-bar app for Claude Code — live context gauge, cost, and optimizer"
authors = ["HackPoint"]
license = "MIT"
repository = "https://github.com/HackPoint/lumen"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-positioner = { version = "2.3.2", features = ["tray-icon"] }
lumen-core = { path = "../../crates/lumen-core" }
lumen-stats = { path = "../../crates/lumen-stats" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
dirs = "6.0.0"
