[package]
name = "lumen-core"
version = "1.4.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
# `bundled` compiles SQLite from source via libsqlite3-sys — no system libsqlite3
# needed on any OS. Feature unifies with sqlx-sqlite (shared libsqlite3-sys 0.37),
# so the whole workspace builds on macOS, Linux, and Windows without a system lib.
# Both crates link `sqlite3`, so rusqlite is capped at the release that agrees
# with sqlx on libsqlite3-sys — sqlx 0.9 accepts >=0.30.1 <0.38, which makes
# rusqlite 0.39 the ceiling. Bump the two together, never one alone.
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
dirs = "6"
tiktoken-rs = "0.12"
once_cell = "1"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
