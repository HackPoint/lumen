[package]
name = "lumen-daemon"
version = "1.1.2"
edition = "2024"

[dependencies]
lumen-core = { path = "../lumen-core" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
dirs = "6"
notify = "8"
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# The e2e tests assert on the aggregates the GUI actually displays.
lumen-stats = { path = "../lumen-stats" }