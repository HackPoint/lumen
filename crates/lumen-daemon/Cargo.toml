[package]
name = "lumen-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
lumen-core = { path = "../lumen-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
dirs = "5"
notify = "6"
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"