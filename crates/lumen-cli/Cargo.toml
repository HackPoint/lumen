[package]
name = "lumen-cli"
version = "1.4.0"
edition = "2024"

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-core = { path = "../lumen-core" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
tungstenite = "0.30"
dirs = "6"

[dev-dependencies]
tempfile = "3"
