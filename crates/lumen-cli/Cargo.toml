[package]
name = "lumen-cli"
version = "1.8.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-core = { path = "../lumen-core" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tungstenite = "0.30"
dirs = "7"

[dev-dependencies]
tempfile = "3"
# The savings parity test compares `lumen report --json` with the app's own loader, which is
# lumen-stats over sqlx. Dev-only: the `lumen` binary does not link either.
lumen-stats = { path = "../lumen-stats" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
