[package]
name = "lumen-mcp"
version = "1.3.1"
edition = "2024"

# Request handling lives in the lib so it can be unit-tested; the binaries are
# thin shells that own the stdout/DB side effects.
[lib]
name = "lumen_mcp"
path = "src/lib.rs"

[[bin]]
name = "lumen-mcp"
path = "src/main.rs"

[[bin]]
name = "lumen-tok"
path = "src/tok.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lumen-core = { path = "../lumen-core" }

[dev-dependencies]
tempfile = "3"
# The metering tests read back the row the binary wrote, so they need a SQLite
# client of their own; the production crate reaches the DB only through lumen-core.
rusqlite = { version = "0.39", features = ["bundled"] }
